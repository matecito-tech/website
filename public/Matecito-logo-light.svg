<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="logo-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00704A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#00704A" filter="url(#logo-shadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#00704A" stroke-width="3" opacity="0.3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#00704A" stroke-width="2" opacity="0.15"/>
  <g filter="url(#logo-shadow)">
    <text x="100" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="white" font-style="italic">Matecito</text>
    <text x="100" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.9">Desarrollo Artesanal</text>
  </g>
</svg>